<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>碳小树素材对照</title>
<style>
  body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#111}
  section{padding:36px 40px}
  .dark{background:#080C07}
  .light{background:#E9E9EC}
  h2{font-size:13px;letter-spacing:2px;margin:0 0 20px;font-weight:600}
  .dark h2{color:rgba(246,246,248,.55)}
  .light h2{color:rgba(18,24,13,.55)}
  table{border-collapse:collapse}
  th{font-size:11px;font-weight:500;padding:8px;text-align:center}
  .dark th{color:rgba(246,246,248,.5)} .light th{color:rgba(18,24,13,.5)}
  td{padding:8px;text-align:center;vertical-align:middle}
  .label{font-size:12px;width:70px}
  .dark .label{color:rgba(246,246,248,.7)} .light .label{color:rgba(18,24,13,.7)}
  .cell{width:126px;height:132px;display:flex;align-items:center;justify-content:center;border-radius:18px}
  .dark .cell{background:#10150E;border:1px solid rgba(246,246,248,.08)}
  .light .cell{background:#F6F6F8;border:1px solid rgba(18,24,13,.08)}
  .cell img{width:106px;height:106px}
  .small{display:flex;gap:16px;margin-top:26px;align-items:flex-end}
  .small .box{display:flex;flex-direction:column;align-items:center;gap:8px}
  .small img{width:56px;height:56px}
  .small span{font-size:11px;opacity:.55}
</style>
</head>
<body>

<section class="dark">
  <h2>深色底 · 4 形态 × 4 阶段</h2>
  <table id="darkTable"></table>
  <div class="small" id="darkSmall"></div>
</section>

<section class="light">
  <h2>浅色底 · 同一批素材</h2>
  <table id="lightTable"></table>
</section>

<script>
const V = [["mixed","均衡"],["travel","出行"],["recycle","回收"],["food","饮食"],["energy","节能"]];
const S = [[2,"小树"],[3,"开花"],[4,"结果"],[5,"常青"]];
const BASE = "../../../entry/src/main/resources/base/media/";
function table(id){
  const head = `<tr><th></th>${S.map(s=>`<th>${s[1]}</th>`).join("")}</tr>`;
  const rows = V.map(([v,n])=>`<tr><td class="label">${n}型</td>${
    S.map(([s])=>`<td><div class="cell"><img src="${BASE}tree_${v}_${s}.svg" alt=""></div></td>`).join("")
  }</tr>`).join("");
  document.getElementById(id).innerHTML = head + rows;
}
table("darkTable"); table("lightTable");
document.getElementById("darkSmall").innerHTML =
  [["0","种子"],["1","幼苗"]].map(([s,n])=>`<div class="box"><img src="${BASE}sapling_${s}.svg" alt=""><span>${n}</span></div>`).join("");
</script>
</body>
</html>
