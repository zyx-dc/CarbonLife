<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Temaki 派生树 · 108px</title>
<style>
  body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#111}
  section{padding:34px 38px}
  .dark{background:#080C07;color:#F6F6F8}
  .light{background:#E9E9EC;color:#12180D}
  h2{font-size:13px;letter-spacing:2px;font-weight:600;margin:0 0 20px;opacity:.55}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .item{width:132px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
  .box img{width:108px;height:108px;object-fit:contain}
  .name{font-size:11px;opacity:.7}
  .stages{display:flex;gap:14px;align-items:flex-end}
  .stages .box{width:110px;height:110px}
  .stages img{width:100px;height:100px}
  .note{font-size:12px;line-height:1.8;opacity:.55;margin-top:18px}
</style>
</head>
<body>
<section class="dark">
  <h2>DARK · 108PX · 结果期</h2>
  <div class="row" id="darkRow"></div>
  <div class="note">底图：Temaki（CC0） · 种子/幼苗与花果为程序化叠加 · 单色轮廓 + 深色错位一层</div>
</section>
<section class="light">
  <h2>LIGHT · 同一批</h2>
  <div class="row" id="lightRow"></div>
</section>
<section class="dark">
  <h2>六个阶段 · 均衡</h2>
  <div class="stages" id="stages"></div>
</section>
<section class="light">
  <h2>六个阶段 · 回收（枯枝回芽）</h2>
  <div class="stages" id="stagesRecycle"></div>
</section>
<script>
const V = [["mixed","均衡"],["travel","出行"],["recycle","回收"],["energy","节能"],["food","餐饮"]];
function row(id){
  document.getElementById(id).innerHTML = V.map(([v,n])=>`
    <div class="item"><div class="box"><img src="tree_${v}_4.svg" alt=""></div><div class="name">${n}</div></div>`).join("");
}
row("darkRow"); row("lightRow");
document.getElementById("stages").innerHTML = [0,1,2,3,4,5].map(s=>`
  <div class="item"><div class="box"><img src="tree_mixed_${s}.svg" alt=""></div><div class="name">stage ${s}</div></div>`).join("");
document.getElementById("stagesRecycle").innerHTML = [0,1,2,3,4,5].map(s=>`
  <div class="item"><div class="box"><img src="tree_recycle_${s}.svg" alt=""></div><div class="name">stage ${s}</div></div>`).join("");
</script>
</body>
</html>
