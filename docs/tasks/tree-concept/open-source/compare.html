<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>开源树素材对照 · 108px</title>
<style>
  body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#111}
  section{padding:32px 36px}
  .dark{background:#080C07;color:#F6F6F8}
  .light{background:#E9E9EC;color:#12180D}
  h2{font-size:13px;letter-spacing:2px;font-weight:600;margin:0 0 18px;opacity:.55}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .item{width:128px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:118px;height:118px;display:flex;align-items:center;justify-content:center;border-radius:18px}
  .dark .box{background:#10150E;border:1px solid rgba(246,246,248,.08)}
  .light .box{background:#F6F6F8;border:1px solid rgba(18,24,13,.08)}
  .box img{width:96px;height:96px;object-fit:contain}
  .dark .box img{filter:invert(1)}
  .name{font-size:11px;text-align:center;line-height:1.4}
  .lic{font-size:10px;opacity:.45;text-align:center}
  .note{font-size:12px;line-height:1.8;opacity:.55;margin-top:20px}
</style>
</head>
<body>
<section class="dark">
  <h2>DARK · 108PX · 96PX 内容</h2>
  <div class="row" id="darkRow"></div>
  <div class="note">
    Temaki = CC0（免署名，可商用）· game-icons = CC BY 3.0（需在关于页署名作者）<br/>
    这组只验证"成熟树"的形态与风格；种子/幼苗/开花/结果仍需另配或程序化派生。
  </div>
</section>
<section class="light">
  <h2>LIGHT · 同一批</h2>
  <div class="row" id="lightRow"></div>
</section>
<script>
const items = [
  ["temaki-broadleaved","Temaki 阔叶","CC0"],
  ["temaki-needleleaved","Temaki 针叶","CC0"],
  ["temaki-palm","Temaki 棕榈","CC0"],
  ["temaki-leafless","Temaki 落叶","CC0"],
  ["games-oak","game-icons 橡树","CC BY 3.0"],
  ["games-pine","game-icons 松","CC BY 3.0"],
  ["games-palm","game-icons 棕榈","CC BY 3.0"],
  ["games-fruit","game-icons 果树","CC BY 3.0"],
  ["games-willow","game-icons 柳","CC BY 3.0"],
  ["games-sprout","game-icons 幼苗","CC BY 3.0"],
  ["games-seeds","game-icons 种子","CC BY 3.0"]
];
function row(id){
  document.getElementById(id).innerHTML = items.map(([f,n,l])=>`
    <div class="item">
      <div class="box"><img src="${f}.svg" alt=""></div>
      <div class="name">${n}</div>
      <div class="lic">${l}</div>
    </div>`).join("");
}
row("darkRow"); row("lightRow");
</script>
</body>
</html>
